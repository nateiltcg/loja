<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos personalizados — Nateil TCG</title>
<meta name="description" content="Produtos personalizados da Nateil TCG.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="pg-header">
    <div class="pg-logo-row">
      <a href="/">
        <img src="/assets/nateil.svg" alt="Nateil TCG">
      </a>
    </div>

    <nav class="pg-nav" aria-label="Navegação principal">
      <a href="/pokemon">
        Pokemon
      </a>
      <a href="/lorcana">
        Lorcana
      </a>
      <a href="/acessorios">
        Acessórios
      </a>
      <a href="/personalizados" class="active" aria-current="page">
        Produtos personalizados
      </a>
      <a href="/brinquedos">
        Blind Box/Brinquedos
      </a>
    </nav>
  </header>

  <main class="wrap pg-main">

    <section class="pg-banner" id="bannerCarousel">
      <div class="pg-slide active">
        <a href="https://chat.whatsapp.com/DxCdR6WEBDR1v2R4oWhvrO" target="_blank" rel="noopener noreferrer"><img src="/assets/banner_whats.png" alt="Entre no nosso grupo do WhatsApp!"></a>
      </div>
      <div class="pg-banner-dots"></div>
    </section>

    <!-- Cada grade diz o que mostrar em data-tags. O /loja.js preenche sozinho. -->
    <!-- Seção sem produtos some sozinha (ou mostra a mensagem de data-vazio). -->

    <section class="hs-section">
      <div class="hs-head">
        <div class="hs-title"><span class="bar"></span><p>Produtos personalizados</p></div>
      </div>
      <section class="pg-grid" id="personalizados" data-tags="personalizados" data-vazio="Em breve por aqui."></section>
    </section>

    <section class="hs-section">
      <div class="hs-head">
        <div class="hs-title"><span class="bar"></span><p>Esgotados</p></div>
      </div>
      <section class="pg-grid" id="esgotados" data-tags="personalizados esgotado"></section>
    </section>
  </main>

  <footer class="pg-footer" id="contato">
    <div class="wrap pg-footer-inner">
      <div class="pg-footer-brand">
        <p>Nateil TCG</p>
        <ul class="pg-footer-links">
          <li><a href="https://chat.whatsapp.com/DxCdR6WEBDR1v2R4oWhvrO" target="_blank" rel="noopener noreferrer">Whatsapp</a></li>
          <li><a href="/como-comprar.html">Como comprar</a></li>
        </ul>
      </div>
      <div class="pg-footer-right">
        <div class="pg-socials">
          <a href="https://chat.whatsapp.com/DxCdR6WEBDR1v2R4oWhvrO" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><img src="/assets/whats.svg" alt=""></a>
          <a href="https://www.tiktok.com/@nateil.tcg" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="/assets/tiktok.svg" alt=""></a>
          <a href="https://www.youtube.com/@nateil" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="/assets/youtube.svg" alt=""></a>
          <a href="https://www.instagram.com/nateil.tcg/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="/assets/insta.svg" alt=""></a>
          <a href="https://mypcards.com/Nateil" target="_blank" rel="noopener noreferrer" aria-label="MyPCards"><img src="/assets/mypcards.svg" alt=""></a>
        </div>
        <div class="pg-copyright">
          <span>© 2026 Nateil TCG. Todos os direitos reservados</span>
          <span>Pokémon Company International ©</span>
          <span>Copag ©</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Monta os produtos e a modal de compra (inclui o rastreio UTM) -->
  <script src="/loja.js"></script>

</body>
</html>
