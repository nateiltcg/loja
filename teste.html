<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — Nateil TCG</title>
<meta name="description" content="Confira os produtos disponíveis na Nateil TCG: blisters, boosters, caixas e muito mais.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="pg-header">
    <div class="pg-logo-row">
      <a href="index.html">
        <!-- Exporte o "logo" (com o selo TGC) do Figma e troque este caminho -->
        <img src="assets/nateil.svg" alt="Nateil TCG">
      </a>
    </div>

    <nav class="pg-nav" aria-label="Navegação principal">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
        Início
      </a>
      <a href="#produtos" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Produtos
      </a>
      <a href="#contato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Contato
      </a>
    </nav>
  </header>

  <main class="wrap pg-main">

    <!-- BANNER / CARROSSEL — troque as imagens pelas artes reais de cada coleção -->
    <section class="pg-banner" id="bannerCarousel">
      <div class="pg-slide active">
        <a href="https://www.tiktok.com/live/event/7677496727439409153?enter_from=personal_live_event_card" target="_blank"><img src="assets/banner_sorteio.png" alt="Coleção Escuridão Absoluta, já disponível"></a>
      </div>
      <div class="pg-banner-dots"></div>
    </section>

    <!-- GRADE DE PRODUTOS -->
    <section class="pg-grid" id="produtos">
     <script>
  fetch('produtos.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('produtos').innerHTML = html;
      inicializarBotoesComprar(); // reativa os cliques de "Comprar" nos produtos recém-carregados
    });
</script>
    </section>
  </main>

  <footer class="pg-footer" id="contato">
    <div class="wrap pg-footer-inner">

      <div class="pg-footer-brand" id="contato">
        <p>Nateil TCG</p>
        <ul class="pg-footer-links">
          <li><a href="https://chat.whatsapp.com/DxCdR6WEBDR1v2R4oWhvrO" target="_blank" rel="noopener noreferrer">Whatsapp</a></li>
          <li><a href="comocomprar.html">Como comprar</a></li>
        </ul>
      </div>

      <div class="pg-footer-right">
        <div class="pg-socials">
          <a href="https://chat.whatsapp.com/DxCdR6WEBDR1v2R4oWhvrO" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><img src="assets/whats.svg" alt=""></a>
          <a href="https://www.instagram.com/nateil.tcg/" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="assets/tiktok.svg" alt=""></a>
          <a href="https://www.tiktok.com/@nateil.tcg" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="assets/youtube.svg" alt=""></a>
          <a href="https://www.youtube.com/@nateil" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="assets/insta.svg" alt=""></a>
          <a href="https://mypcards.com/Nateil" target="_blank" rel="noopener noreferrer" aria-label="MyPCards"><img src="assets/mypcards.svg" alt=""></a>
        </div>
        <div class="pg-copyright">
          <span>© 2026 Nateil TCG. Todos os direitos reservados</span>
          <span>Pokémon Company International ©</span>
          <span>Copag ©</span>
        </div>
      </div>

    </div>
  </footer>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <button class="modal-close" id="modalCloseBtn">×</button>
    <div class="modal-left">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-right">
      <h2 id="modalTitle"></h2>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <div class="modal-price">
        <p class="preco" id="modalPreco"></p>
        <p class="pix" id="modalPix"></p>
        <p class="parcelado" id="modalParcelado"></p>
      </div>
      <a class="modal-buy" id="modalTiktok" href="#" target="_blank">Comprar na LigaBRA</a>
      <a class="modal-buy-outline" id="modalWhats" href="#" target="_blank">Comprar pelo WhatsApp</a>
    </div>
  </div>
</div>
  
</body>
</html>
