<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nateil TCG — Em breve</title>
<meta name="description" content="Loja de cartas Pokémon. Em breve por aqui.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #002036;
    --heading: #E2E2E2;
  }

  *{ box-sizing: border-box; }

  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 52px;
    width:100%;
    max-width: 497px;
  }

  h1{
    margin:0;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--heading);
    text-align:center;
    font-size: clamp(2.6rem, 11vw, 5rem);
    line-height: normal;
  }

  /* illustration + wordmark block */
  .art{
    position: relative;
    width: 100%;
    max-width: 497px;
    aspect-ratio: 497 / 297.2225;
  }
  .art img{
    position:absolute;
    display:block;
  }
  .art .illustration{
    left:0; top:0;
    width:100%;
    height: 68.32%;
  }
  .art .wordmark{
    left: 21.43%;
    top: 78.08%;
    width: 52.18%;
    height: 21.93%;
  }

  /* social row */
  .socials{
    position: relative;
    width: 100%;
    max-width: 425px;
    aspect-ratio: 425 / 48;
  }
  .socials img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .socials nav{
    position:absolute;
    inset:0;
  }
  .socials a{
    position:absolute;
    top:0;
    height:100%;
    border-radius: 8px;
    outline-offset: 3px;
  }
  .socials a:focus-visible{
    outline: 2px solid var(--heading);
  }
  .socials a.youtube{    left:0%;      width:11.29%; }
  .socials a.instagram{  left:30.12%;  width:9.65%;  }
  .socials a.tiktok{     left:58.59%;  width:11.29%; }
  .socials a.mypcards{   left:88.71%;  width:11.29%; }

</style>
</head>
<body>

  <main class="hero">

    <h1>em breve</h1>

    <div class="art">
      <img class="illustration"
           src="nateil.svg"
           alt="Ilustração do Shuckle, mascote da Nateil TCG">
      <img class="wordmark"
           src="tcg.svg"
           alt="Nateil TCG">
    </div>

    <div class="socials">
      <nav aria-label="Redes sociais">
        <a class="youtube" href="#" aria-label="YouTube"><img src="https://www.figma.com/api/mcp/asset/00812608-647c-43e2-8eb7-d84fe64b0a80.svg" alt="" aria-hidden="true"></a>
        <a class="instagram" href="#" aria-label="Instagram"></a>
        <a class="tiktok" href="#" aria-label="TikTok"></a>
        <a class="mypcards" href="https://mypcards.com/Nateil" target="_blank" rel="noopener noreferrer" aria-label="Perfil na MyPCards"></a>
      </nav>
    </div>

  </main>

</body>
</html>
